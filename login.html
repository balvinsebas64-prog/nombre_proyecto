<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Sistema de Gestión</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/vendor/poppins/poppins.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="formulario">
            <h2><i class="fas fa-lock"></i> Acceso al Sistema</h2>

            <label for="correoLogin"><i class="fas fa-envelope"></i> Correo electrónico</label>
            <input type="email" id="correoLogin" placeholder="admin@gmail.com" required>

            <label for="claveLogin"><i class="fas fa-key"></i> Contraseña</label>
            <input type="password" id="claveLogin" placeholder="••••••••" required>

            <button type="button" class="principal" data-accion="iniciarSesion">
                <i class="fas fa-sign-in-alt"></i> Ingresar
            </button>

            <p id="mensaje" class="mensaje"></p>

            <div class="login-links">
                <a href="cambiar_clave.html"><i class="fas fa-edit"></i> Cambiar contraseña</a>
                <a href="recuperar.html"><i class="fas fa-unlock"></i> ¿Olvidaste tu contraseña?</a>
            </div>
        </div>
    </div>

    <script src="scripts/util.js"></script>
    <script src="scripts/pages/login.js"></script>
</body>
</html>
